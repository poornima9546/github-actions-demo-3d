name: Deploy Website to Azure VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "echo SSH connection successful"

      - name: Deploy to Azure VM
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" << 'EOF'

          set -e

          sudo apt-get update

          if [ ! -d ~/github-actions-demo-3d ]; then
              git clone https://github.com/${{ github.repository }}.git ~/github-actions-demo-3d
          fi

          cd ~/github-actions-demo-3d

          git fetch origin
          git reset --hard origin/main

          sudo mkdir -p /var/www/threed-demo

          sudo cp -r ./* /var/www/threed-demo/

          sudo chown -R www-data:www-data /var/www/threed-demo

          sudo systemctl restart nginx

          echo "Deployment Successful"

          EOF

      - name: Verify Deployment
        run: |
          curl --fail "http://${{ secrets.VM_HOST }}"